name: Bug report
description: Something broke in Block Viewer
labels: ["bug"]
body:
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What steps are required to reproduce the problem?
      placeholder: |
        1. Launch BlockViewer.exe
        2. Log in / open demo
        3. …
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened (error text, crash, wrong UI…).
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Viewer version, OS, GPU
      placeholder: Block Viewer 0.0.3, Windows 11, RTX 4070
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Paste relevant log lines (Dev Toolbox copy tools preferred over full logs).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about Block Viewer (the client), not Block-GPPI (the injector)
          required: true
