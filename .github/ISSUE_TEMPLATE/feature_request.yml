name: Feature request
description: Suggest an improvement for Block Viewer
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Block Viewer to do instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Avatar / appearance
        - Chat / IM
        - Voice
        - Inventory
        - Rendering / graphics
        - UI / preferences
        - Network / login
        - Build tools
        - Docs / website
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about Block Viewer (the client), not Block-GPPI (the injector)
          required: true
