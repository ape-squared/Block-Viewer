name: CI

# Lean Block Viewer CI: no clippy, no cargo tests. Pages and release are separate workflows.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: workspace resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo metadata
        run: cargo metadata --locked --format-version 1 > /dev/null
