name: Release

# A version tag (SemVer: v0.2.0, v0.2.1…) pushed by a human builds the
# viewer and publishes the release with notes: the Windows zip (the one the
# updater installs), its crash symbols, and the macOS DMG. Linux still
# dry-runs on packaging PRs only. Use workflow_dispatch with an existing
# tag and only=macos to attach a Mac build to a release that already has
# Windows. Nightly may call this workflow with a beta tag.
# The Nightly workflow calls it with the beta tag it has just pushed (a tag
# pushed with the workflow token starts no workflow by itself); a tag with
# a pre-release part is published as a GitHub pre-release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build for (e.g. v0.1.0)
        required: true
        type: string
      only:
        description: Build only this platform (empty = Windows + macOS)
        required: false
        type: choice
        options:
          - ''
          - macos
          - windows
        default: ''
  workflow_call:
    inputs:
      tag:
        description: Version tag to build and publish (already pushed)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.ps1
      - packaging/linux/**
      - packaging/macos/**
      - scripts/package-macos.ps1
      - assets/branding/block.icns
      - scripts/verify-version.ps1

# a new push to a pull request stops its previous dry run; a release (a
# tag, or the nightly's call) is never cancelled: its group is its own run
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only == 'macos') }}
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust stable
        run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the version comes from the tag; a dry run keeps the one Git describes
      # (block-version refuses a tag that is not the checked-out commit's)
      - name: Build
        shell: pwsh
        run: |
          if ($env:TAG -ne 'dry-run') { $env:AURORA_VERSION_TAG = $env:TAG }
          cargo build --release --locked -p block-viewer
      - name: Verify compiled version
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/block-viewer.exe -Tag $env:TAG
      # Breakpad symbols of the exe for the crash reports (docs/BUG_REPORTING.md):
      # the release profile's line-tables-only PDB, read through the path the
      # exe records, stored as <file>.pdb/<debug id>/<file>.sym, the layout
      # symbolizers look up. The PDB itself is not published.
      - name: Install dump_syms
        run: cargo install dump_syms --locked --version 2.3.9
      - name: Symbols
        shell: pwsh
        run: |
          dump_syms target/release/block-viewer.exe --store symbols
          if ($LASTEXITCODE -ne 0) { throw 'dump_syms failed' }
          $zip = "Block-Viewer-$env:TAG-windows-x64-symbols.zip"
          & 7z a -tzip -mx=9 $zip ./symbols/* | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding utf8NoBOM
          Get-ChildItem symbols -Recurse -File | ForEach-Object { "$($_.FullName.Substring((Resolve-Path symbols).Path.Length + 1)) $([math]::Round($_.Length / 1MB)) MB" }
          "zip $([math]::Round((Get-Item $zip).Length / 1MB)) MB"
          "SYMBOLS=$zip" >> $env:GITHUB_ENV
      - name: Package
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: |
          $v = $env:TAG
          $dir = "Block-Viewer-$v-windows-x64"
          ./scripts/package.ps1 -Exe target/release/block-viewer.exe -Out $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          ./scripts/write-update-policy.ps1 -Tag $v
          "ZIP=$dir.zip" >> $env:GITHUB_ENV
      - name: Publish
        if: env.TAG != 'dry-run'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = $env:TAG
          # Title must say Block Viewer (not Aurora). GITHUB_TOKEN creates do
          # not fire other workflows' `release` events, so Discord is notified
          # by the notify-discord job below (DISCORD_RELEASES_WEBHOOK).
          # Notes: header + commit subjects since the previous tag. Pure
          # --generate-notes is empty on this fork (no labeled PRs), so the
          # release page only showed a compare link; list the commits instead.
          $header = Get-Content -LiteralPath .github/release-notes-header.md -Raw
          $prev = git tag --list 'v*' --sort=-v:refname |
            Where-Object { $_ -ne $v -and $_ -notmatch '-' } |
            Select-Object -First 1
          $range = if ($prev) { "$prev..$v" } else { $v }
          $commits = @(git log --pretty=format:'- %s' $range)
          if (-not $commits -or $commits.Count -eq 0) {
            $commits = @('- See the repository history for this tag.')
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$v.md"
          $body = ($header.TrimEnd() + "`n`n## What's new`n`n" + ($commits -join "`n") + "`n")
          if ($prev) {
            $body += "`n**Full Changelog**: https://github.com/$($env:GITHUB_REPOSITORY)/compare/$prev...$v`n"
          }
          Set-Content -LiteralPath $notesPath -Value $body -Encoding utf8
          $ghArgs = @($v, $env:ZIP, "$($env:ZIP).sha256", $env:SYMBOLS, "$($env:SYMBOLS).sha256", 'block-update-policy.json', '--title', "Block Viewer $($v.TrimStart('v'))", '--notes-file', $notesPath, '--verify-tag')
          if ($v -match '-') { $ghArgs += '--prerelease' }   # v0.3.0-beta.1
          gh release create @ghArgs
      - name: Dry-run symbols
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-windows-dry-run
          path: |
            ${{ env.SYMBOLS }}
            ${{ env.SYMBOLS }}.sha256
          compression-level: 0

  # GITHUB_TOKEN release creates do not trigger discord-release.yml (`release`
  # events from the default token are swallowed). Post here once Windows has
  # published the zip the Stable updater installs.
  notify-discord:
    needs: windows
    if: ${{ !cancelled() && needs.windows.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - name: Post release embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TESTER_ROLE: ${{ secrets.DISCORD_TESTER_ROLE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_RELEASES_WEBHOOK secret is missing; skipping Discord notify" >&2
            exit 0
          fi
          if [ "${TAG}" = dry-run ]; then
            echo "dry-run: no Discord notify"
            exit 0
          fi
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          export RELEASE_JSON
          python3 - <<'PY'
          import json, os, re, urllib.request
          release = json.loads(os.environ["RELEASE_JSON"])
          webhook = os.environ["WEBHOOK"].rstrip("/")
          if webhook.endswith("/github"):
              webhook = webhook[: -len("/github")]
          tag = release.get("tag_name") or ""
          name = (release.get("name") or tag or "Release").strip()
          url = release.get("html_url") or ""
          prerelease = bool(release.get("prerelease"))
          body = (release.get("body") or "").strip()
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          body = re.sub(r"(?im)^#+\s*Block Viewer\s*$", "", body)
          body = re.sub(r"(?im)^Support:.*$", "", body)
          body = re.sub(r"(?im)^Sister project.*$", "", body)
          body = re.sub(r"\n{3,}", "\n\n", body).strip()
          if len(body) > 1800:
              body = body[:1797].rstrip() + "…"
          if not body:
              body = "Release notes are on GitHub."
          assets = release.get("assets") or []
          windows = next(
              (a for a in assets if a.get("name", "").endswith("-windows-x64.zip") and not a.get("name", "").endswith("-symbols.zip")),
              None,
          )
          macos = next(
              (a for a in assets if a.get("name", "").endswith("-macos-arm64.dmg")),
              None,
          )
          fields = []
          if windows and windows.get("browser_download_url"):
              fields.append({"name": "Windows", "value": f"[Download zip]({windows['browser_download_url']})", "inline": True})
          if macos and macos.get("browser_download_url"):
              fields.append({"name": "macOS", "value": f"[Download DMG]({macos['browser_download_url']})", "inline": True})
          fields.append({"name": "Tag", "value": f"[`{tag}`]({url})" if tag and url else (tag or "—"), "inline": True})
          color = 0x38BDF8 if prerelease else 0xD4FF3F
          title = name if name.lower().startswith("block") else f"Block Viewer {name}"
          embed = {
              "title": title, "url": url, "description": body, "color": color, "fields": fields,
              "thumbnail": {"url": "https://raw.githubusercontent.com/ape-squared/Block-Viewer/main/assets/branding/block-logo-bg.png"},
              "footer": {"text": "Block Viewer · GitHub Releases"},
          }
          if release.get("published_at"):
              embed["timestamp"] = release["published_at"]
          kind = "New pre-release" if prerelease else "New release"
          role = (os.environ.get("TESTER_ROLE") or "").strip()
          allowed = {"parse": []}
          if role.isdigit():
              content = f"{kind} <@&{role}>"
              allowed = {"roles": [role]}
          else:
              content = f"{kind} — testers welcome"
          payload = {
              "username": "Block Viewer",
              "avatar_url": "https://raw.githubusercontent.com/ape-squared/Block-Viewer/main/assets/branding/block-logo-bg.png",
              "content": content,
              "embeds": [embed],
              "allowed_mentions": allowed,
          }
          req = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Block-Viewer-Release-Notify"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"Discord {resp.status}")
          PY

  # Linux is not published yet (Windows-first). Dry-run only on PRs that
  # touch packaging / this workflow. Ubuntu 24.04: glibc 2.39.
  linux:
    needs: windows
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ALSA for the sound, the rest for winit's X11 / Wayland back ends
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the version comes from the tag; a dry run keeps the one Git describes
      # (block-version refuses a tag that is not the checked-out commit's)
      # debug info stays out of the binary, as the Windows exe leaves it in a
      # .pdb that is not published (the binary is about 490 MB with it)
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          if [ "$TAG" != dry-run ]; then export AURORA_VERSION_TAG="$TAG"; fi
          cargo build --release --locked -p block-viewer
      - name: Verify compiled version
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/block-viewer -Tag $env:TAG
      # tar keeps the executable bit
      - name: Package
        shell: pwsh
        run: |
          $v = $env:TAG
          $dir = "Block-Viewer-$v-linux-x64"
          ./scripts/package.ps1 -Exe target/release/block-viewer -Out $dir
          & tar -czf "$dir.tar.gz" $dir
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          $hash = (Get-FileHash -LiteralPath "$dir.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.tar.gz" | Set-Content -LiteralPath "$dir.tar.gz.sha256" -Encoding utf8NoBOM
          "ARCHIVE=$dir.tar.gz" >> $env:GITHUB_ENV
      - name: Publish
        # Kept off public releases (Windows-first); dry-run PRs never hit this.
        if: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256"
      - name: Dry-run archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-linux-dry-run
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          compression-level: 0

  # App bundle + DMG; signing/notarization when Apple secrets exist (docs/MACOS.md).
  # Tag pushes and workflow_dispatch publish to the release; PRs only dry-run.
  macos:
    needs: windows
    if: |
      always() &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.only == 'windows') &&
      (github.event_name == 'pull_request' || github.event_name == 'push' ||
       github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
      APP: Block Viewer.app
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      # Tag / dispatch must build the tagged commit (AURORA_VERSION_TAG refuses
      # a tree ahead of the tag). PRs keep the PR head. A macos-only dispatch
      # then overlays packaging from the workflow commit so Block.app branding
      # shipped after the tag still applies to that release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || inputs.tag || github.ref }}
      - name: Packaging from workflow commit
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git checkout "${{ github.sha }}" -- \
            packaging/macos/Info.plist \
            scripts/package-macos.ps1 \
            assets/branding/block.icns \
            assets/branding/block/02-app-icon
      - name: Rust stable
        run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # (see the Linux job: the tag's version, no debug info in the binary)
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          if [ "$TAG" != dry-run ]; then export AURORA_VERSION_TAG="$TAG"; fi
          cargo build --release --locked -p block-viewer
      - name: Verify compiled version
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/block-viewer -Tag $env:TAG
      - name: Application
        shell: pwsh
        run: ./scripts/package-macos.ps1 -Exe target/release/block-viewer -Out $env:APP
      # the certificate lives in a keychain of this run only; the hardened
      # runtime and a secure timestamp are what the notarization requires
      - name: Sign (Developer ID) and notarize
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -v team="($TEAM_ID)" '/Developer ID Application/ && index($0, team) { print $2; exit }')"
          if [ -z "$identity" ]; then echo "no Developer ID Application identity of team $TEAM_ID in the certificate"; exit 1; fi
          codesign --force --options runtime --timestamp --entitlements packaging/macos/block-viewer.entitlements --sign "$identity" "$APP"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ "$status" != Accepted ]; then
            cat "$RUNNER_TEMP/notary.json"
            id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
            if [ -n "$id" ]; then xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"; fi
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$APP"
          security delete-keychain "$keychain"
      - name: Sign (ad hoc)
        if: env.SIGNED != 'true'
        run: codesign --force --sign - "$APP"
      # the signature holds and the signed executable starts
      - name: Check the application
        run: |
          codesign --verify --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/block-viewer" --version
          if [ "$SIGNED" = true ]; then spctl --assess --type execute --verbose=2 "$APP"; fi
      # a compressed read-only image (UDZO); ditto copies the bundle with its
      # signature (and its stapled ticket)
      - name: Disk image
        run: |
          dmg="Block-Viewer-$TAG-macos-arm64.dmg"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$APP" "$stage/$APP"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Block Viewer" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "ARCHIVE=$dmg" >> "$GITHUB_ENV"
      - name: Publish
        if: env.TAG != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attach to the existing GitHub release for this tag (clobber if a
          # previous Mac asset for the same name is already there).
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
      - name: Dry-run application
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-macos-dry-run
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          compression-level: 0
