name: Release

# A version tag (SemVer: v0.2.0, v0.2.1…) pushed by a human builds the
# viewer and publishes the release with notes grouped by PR label: the
# Windows zip (the one the updater installs) and its crash symbols, then the
# Linux archive and the macOS application. A pull request that changes these
# release files gets a dry run of the three jobs (the version Git describes,
# the symbols, the Linux archive and the macOS application kept as the run's
# artifacts, nothing published): no agent can try the Linux or macOS build
# on its PC, and the symbols need the release build.
# The Nightly workflow calls it with the beta tag it has just pushed (a tag
# pushed with the workflow token starts no workflow by itself); a tag with
# a pre-release part is published as a GitHub pre-release.
# The three build jobs run with a read-only token and hand their files to
# the publish jobs as the run's artifacts; only the publish jobs, which never
# run on a pull request, can write the release. A dry run signs the macOS
# application ad hoc, whatever the repository's signing setup.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_call:
    inputs:
      tag:
        description: Version tag to build and publish (already pushed)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.ps1
      - packaging/linux/**
      - packaging/macos/**
      - scripts/package-macos.ps1
      - assets/branding/aurora.icns
      - scripts/verify-version.ps1

# a new push to a pull request stops its previous dry run; a release (a
# tag, or the nightly's call) is never cancelled: its group is its own run
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      # SignPath reads the job and downloads the unsigned exe (Sign below)
      actions: read
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
      # Code signing (docs/UPDATES.md, "Code signing"): a stable tag only,
      # once the repository turns it on with the SIGNPATH_SIGN_RELEASES
      # variable. A beta (a tag with a pre-release part, the nightly's) stays
      # unsigned: each signature waits for an approver in SignPath.
      SIGN: ${{ github.event_name != 'pull_request' && vars.SIGNPATH_SIGN_RELEASES == 'true' && !contains(inputs.tag || github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the version comes from the tag; a dry run keeps the one Git describes
      # (block-version refuses a tag that is not the checked-out commit's)
      - name: Build
        shell: pwsh
        run: |
          if ($env:TAG -ne 'dry-run') { $env:AURORA_VERSION_TAG = $env:TAG }
          # the OpenXR loader built in: the published exe needs nothing beside it
          cargo build --release --locked -p block-viewer --features xr-static-loader
      - name: Verify compiled version
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Exe target/release/block-viewer.exe -Tag $env:TAG
          # the exe's ProductVersion (build.rs), which SignPath checks
          "VERSION=$($env:TAG -replace '^v', '')" >> $env:GITHUB_ENV
      # Breakpad symbols of the exe for the crash reports (docs/BUG_REPORTING.md):
      # the release profile's line-tables-only PDB, read through the path the
      # exe records, stored as <file>.pdb/<debug id>/<file>.sym, the layout
      # symbolizers look up. The PDB itself is not published.
      - name: Install dump_syms
        run: cargo install dump_syms --locked --version 2.3.9
      - name: Symbols
        shell: pwsh
        run: |
          dump_syms target/release/block-viewer.exe --store symbols
          if ($LASTEXITCODE -ne 0) { throw 'dump_syms failed' }
          $zip = "Block-Viewer-$env:TAG-windows-x64-symbols.zip"
          & 7z a -tzip -mx=9 $zip ./symbols/* | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding utf8NoBOM
          Get-ChildItem symbols -Recurse -File | ForEach-Object { "$($_.FullName.Substring((Resolve-Path symbols).Path.Length + 1)) $([math]::Round($_.Length / 1MB)) MB" }
          "zip $([math]::Round((Get-Item $zip).Length / 1MB)) MB"
          "SYMBOLS=$zip" >> $env:GITHUB_ENV
      # after the symbols: signing does not change the code nor the debug
      # id, so they still match the published exe. Up to an hour for an
      # approver to accept the request in SignPath (link in the step's log);
      # a refused or expired request fails the run before anything is
      # published.
      - name: Sign (SignPath)
        if: env.SIGN == 'true'
        uses: ./.github/actions/signpath-sign
        with:
          exe: target/release/block-viewer.exe
          version: ${{ env.VERSION }}
          signing-policy: release-signing
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          trusted: 'true'
          timeout: '3600'
      - name: Verify signed version
        id: signed
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Exe target/release/block-viewer.exe -Tag $env:TAG
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Package
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: |
          $v = $env:TAG
          $dir = "Block-Viewer-$v-windows-x64"
          ./scripts/package.ps1 -Exe target/release/block-viewer.exe -Out $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          ./scripts/write-update-policy.ps1 -Tag $v
          "ZIP=$dir.zip" >> $env:GITHUB_ENV
      # what the publish job puts in the release
      - name: Release files
        if: env.TAG != 'dry-run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.SYMBOLS }}
            ${{ env.SYMBOLS }}.sha256
            block-update-policy.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Dry-run symbols
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-windows-dry-run
          path: |
            ${{ env.SYMBOLS }}
            ${{ env.SYMBOLS }}.sha256
          compression-level: 0

  # Creates the release with the Windows files. The publish jobs are the only
  # ones whose token can write, and they never run on a pull request. The
  # header (Linden Lab disclaimer, support, privacy: Third-Party Viewer
  # Policy §1.c) comes before the generated notes.
  publish-windows:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
      SIGNED: ${{ needs.windows.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $v = $env:TAG
          $zip = "Block-Viewer-$v-windows-x64.zip"
          $symbols = "Block-Viewer-$v-windows-x64-symbols.zip"
          $notes = '.github/release-notes-header.md'
          # a signed release names its signing first: the SignPath
          # Foundation's terms ask for it on the download pages
          if ($env:SIGNED -eq 'true') {
            $line = 'The Windows executable is signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). [Code signing policy](https://block-viewer.org/code-signing/)'
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes-header.md'
            Set-Content -LiteralPath $notes -Value @($line, '', (Get-Content -Raw -LiteralPath '.github/release-notes-header.md')) -Encoding utf8NoBOM
          }
          $ghArgs = @($v, $zip, "$zip.sha256", $symbols, "$symbols.sha256", 'block-update-policy.json', '--title', "Block Viewer $v", '--notes-file', $notes, '--generate-notes', '--verify-tag')
          if ($v -match '-') { $ghArgs += '--prerelease' }   # v0.3.0-beta.1
          gh release create @ghArgs
      # GITHUB_TOKEN publishes do not trigger release: workflows; notify Discord here.
      - name: Notify Discord
        if: env.TAG != 'dry-run'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK || vars.DISCORD_RELEASES_WEBHOOK }}
          TESTER_ROLE: ${{ secrets.DISCORD_TESTER_ROLE_ID || vars.DISCORD_TESTER_ROLE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::Discord notify skipped — set repo secret or variable DISCORD_RELEASES_WEBHOOK (releases channel webhook)" >&2
            exit 0
          fi
          export RELEASE_JSON="$(gh release view "$TAG" --repo "$GH_REPO" --json tagName,name,body,htmlUrl,prerelease,publishedAt,assets)"
          python3 - <<'PY'
          import json, os, re, urllib.request
          release = json.loads(os.environ["RELEASE_JSON"])
          webhook = os.environ["WEBHOOK"].rstrip("/")
          if webhook.endswith("/github"):
              webhook = webhook[: -len("/github")]
          tag = release.get("tagName") or ""
          name = (release.get("name") or tag or "Release").strip()
          url = release.get("htmlUrl") or ""
          prerelease = bool(release.get("prerelease"))
          body = (release.get("body") or "").strip()
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          body = re.sub(r"(?im)^#+\s*Block Viewer\s*$", "", body)
          body = re.sub(r"(?im)^Support:.*$", "", body)
          body = re.sub(r"(?im)^Sister project.*$", "", body)
          body = re.sub(r"\n{3,}", "\n\n", body).strip()
          if len(body) > 1800:
              body = body[:1797].rstrip() + "…"
          if not body:
              body = "Release notes are on GitHub."
          assets = release.get("assets") or []
          windows = next(
              (a for a in assets if a.get("name", "").endswith("-windows-x64.zip") and not a.get("name", "").endswith("-symbols.zip")),
              None,
          )
          fields = []
          if windows and windows.get("browserDownloadUrl"):
              fields.append({"name": "Windows", "value": f"[Download zip]({windows['browserDownloadUrl']})", "inline": True})
          fields.append({"name": "Tag", "value": f"[`{tag}`]({url})" if tag and url else (tag or "—"), "inline": True})
          color = 0x38BDF8 if prerelease else 0xD4FF3F
          title = name if name.lower().startswith("block") else f"Block Viewer {name}"
          embed = {"title": title, "url": url, "description": body, "color": color, "fields": fields,
                   "thumbnail": {"url": "https://raw.githubusercontent.com/ape-squared/Block-Viewer/main/assets/branding/block-logo-bg.png"},
                   "footer": {"text": "Block Viewer · GitHub Releases"}}
          if release.get("publishedAt"):
              embed["timestamp"] = release["publishedAt"]
          kind = "New pre-release" if prerelease else "New release"
          role = (os.environ.get("TESTER_ROLE") or "").strip()
          allowed = {"parse": []}
          if role.isdigit():
              content = f"{kind} <@&{role}>"
              allowed = {"roles": [role]}
          else:
              content = f"{kind} — testers welcome"
          payload = {"username": "Block Viewer", "avatar_url": embed["thumbnail"]["url"], "content": content, "embeds": [embed], "allowed_mentions": allowed}
          req = urllib.request.Request(webhook + "?wait=true", data=json.dumps(payload).encode(),
                                     headers={"Content-Type": "application/json", "User-Agent": "Block-Viewer-Release-Notify"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"Discord {resp.status}")
          PY

  # The Linux archive joins the release once it is published: a Linux build
  # that fails leaves the Windows release in place and the run red (re-run
  # the failed jobs after a passing failure; a fix in the code needs a new
  # version). Ubuntu 24.04: glibc 2.39, so current distributions (Arch,
  # Fedora, Ubuntu 24.04 and later) run it.
  linux:
    needs: windows
    if: ${{ !cancelled() && (needs.windows.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # ALSA for the sound, the rest for winit's X11 / Wayland back ends
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the version comes from the tag; a dry run keeps the one Git describes
      # (block-version refuses a tag that is not the checked-out commit's)
      # debug info stays out of the binary, as the Windows exe leaves it in a
      # .pdb that is not published (the binary is about 490 MB with it)
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          if [ "$TAG" != dry-run ]; then export AURORA_VERSION_TAG="$TAG"; fi
          cargo build --release --locked -p block-viewer
      - name: Verify compiled version
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/block-viewer -Tag $env:TAG
      # tar keeps the executable bit
      - name: Package
        shell: pwsh
        run: |
          $v = $env:TAG
          $dir = "Block-Viewer-$v-linux-x64"
          ./scripts/package.ps1 -Exe target/release/block-viewer -Out $dir
          & tar -czf "$dir.tar.gz" $dir
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          $hash = (Get-FileHash -LiteralPath "$dir.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.tar.gz" | Set-Content -LiteralPath "$dir.tar.gz.sha256" -Encoding utf8NoBOM
          "ARCHIVE=$dir.tar.gz" >> $env:GITHUB_ENV
      - name: Release files
        if: env.TAG != 'dry-run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Dry-run archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-linux-dry-run
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          compression-level: 0

  publish-linux:
    needs: [linux, publish-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="Block-Viewer-$TAG-linux-x64.tar.gz"
          gh release upload "$TAG" "$archive" "$archive.sha256"

  # The macOS application (Apple Silicon) joins the release like the Linux
  # archive: "Block Viewer.app" in a disk image, next to a link to
  # Applications to drag it onto, as Mac applications are installed. Signed with the Developer ID, then notarized and stapled,
  # when the repository has the Apple secrets (docs/MACOS.md, "Signing");
  # signed ad hoc otherwise, which macOS opens only after "Open Anyway" in
  # Privacy & Security. The updater does not install it: the viewer points
  # to the release page, as on Linux.
  macos:
    needs: windows
    if: ${{ !cancelled() && (needs.windows.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
      APP: Block Viewer.app
      # never on a pull request: its dry run signs ad hoc
      SIGNED: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # (see the Linux job: the tag's version, no debug info in the binary)
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          if [ "$TAG" != dry-run ]; then export AURORA_VERSION_TAG="$TAG"; fi
          cargo build --release --locked -p block-viewer
      - name: Verify compiled version
        if: env.TAG != 'dry-run'
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/block-viewer -Tag $env:TAG
      - name: Application
        shell: pwsh
        run: ./scripts/package-macos.ps1 -Exe target/release/block-viewer -Out $env:APP
      # the certificate lives in a keychain of this run only; the hardened
      # runtime and a secure timestamp are what the notarization requires
      - name: Sign (Developer ID) and notarize
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -v team="($TEAM_ID)" '/Developer ID Application/ && index($0, team) { print $2; exit }')"
          if [ -z "$identity" ]; then echo "no Developer ID Application identity of team $TEAM_ID in the certificate"; exit 1; fi
          codesign --force --options runtime --timestamp --entitlements packaging/macos/block-viewer.entitlements --sign "$identity" "$APP"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ "$status" != Accepted ]; then
            cat "$RUNNER_TEMP/notary.json"
            id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
            if [ -n "$id" ]; then xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"; fi
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$APP"
          security delete-keychain "$keychain"
      - name: Sign (ad hoc)
        if: env.SIGNED != 'true'
        run: codesign --force --sign - "$APP"
      # the signature holds and the signed executable starts
      - name: Check the application
        run: |
          codesign --verify --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/block-viewer" --version
          if [ "$SIGNED" = true ]; then spctl --assess --type execute --verbose=2 "$APP"; fi
      # a compressed read-only image (UDZO); ditto copies the bundle with its
      # signature (and its stapled ticket)
      - name: Disk image
        run: |
          dmg="Block-Viewer-$TAG-macos-arm64.dmg"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$APP" "$stage/$APP"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Block Viewer" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "ARCHIVE=$dmg" >> "$GITHUB_ENV"
      - name: Release files
        if: env.TAG != 'dry-run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Dry-run application
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-macos-dry-run
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          compression-level: 0

  publish-macos:
    needs: [macos, publish-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
