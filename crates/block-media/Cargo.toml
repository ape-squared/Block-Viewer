[package]
name = "block-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Media plugin host for Block Viewer: drives SLPlugin media plugins (CEF web, LibVLC video) like LLPluginProcessParent / LLPluginClassMedia."

[dependencies]
block-llsd = { version = "0.1.0", path = "../block-llsd" }
log = "0.4.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
env_logger = "0.11.11"

[lints]
workspace = true
