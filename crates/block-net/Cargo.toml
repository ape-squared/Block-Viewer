[package]
name = "block-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
block-assets = { version = "0.1.0", path = "../block-assets" }
block-i18n = { version = "0.1.0", path = "../block-i18n" }
block-llsd = { version = "0.1.0", path = "../block-llsd" }
block-msg = { version = "0.1.0", path = "../block-msg" }
block-prim = { version = "0.1.0", path = "../block-prim" }
block-proxy = { version = "0.1.0", path = "../block-proxy" }
block-version = { version = "0.1.0", path = "../block-version" }
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
glam = "0.34.1"
log = "0.4.34"
md5 = "0.8.1"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["alloc"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webpki-root-certs = "1.0.9"

[dev-dependencies]
rcgen = "0.14.10"

# rustls-webpki is used: its library is named `webpki` (sim_tls.rs), which
# cargo-machete does not see from the package name
[package.metadata.cargo-machete]
ignored = ["rustls-webpki"]

[lints]
workspace = true
